name: Build Windows EXE

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl
          
      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name modify_schedule run_modify_schedule.py
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: modify-schedule-exe
          path: dist/modify_schedule.exe
