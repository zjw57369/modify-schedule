name: Build All-in-One Package

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pyinstaller openpyxl flask
          
      - name: Build EXE
        run: |
          pyinstaller --onefile --console --name modify_schedule run_modify_schedule.py
          
      - name: Prepare release package
        run: |
          mkdir release
          copy dist\modify_schedule.exe release\
          copy app.py release\
          copy "排班工具.html" release\
          copy requirements.txt release\
          copy "启动网页版.bat" release\
          copy README.txt release\
          xcopy /E /I templates release\templates\
          
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: 排班工具-全功能版
          path: release/
